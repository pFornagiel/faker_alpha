services:
  app:
    build: .
    ports: ["${FTF_PORT:-8765}:8765"]   # FTF_PORT=8770 docker compose up -d when 8765 is taken
    volumes:
      - ./data:/app/data            # dataset, store (sqlite), caches, reference faces, exports
    environment:
      - FTF_LLM=${FTF_LLM:-auto}    # claude CLI is not inside the container -> Gemini (GEMINI_API_KEY) or rules
      - FTF_STORE=${FTF_STORE:-data/store/ftf.sqlite}   # relative to /app, i.e. inside ./data
      - FTF_ENRICH=${FTF_ENRICH:-1}  # 0 = no RDAP / DNS / crt.sh lookups
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=fakefakefake
  scheduler:
    build: .
    command: ["python", "-m", "ftf.scheduler", "--every", "30", "--analyse"]
    volumes: ["./data:/app/data"]
    environment:
      - FTF_STORE=${FTF_STORE:-data/store/ftf.sqlite}
      - FTF_ENRICH=${FTF_ENRICH:-1}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    profiles: ["scheduler"]
  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/fakefakefake
    profiles: ["neo4j"]
