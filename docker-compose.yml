services:
  app:
    build: .
    ports: ["8765:8765"]
    volumes:
      - ./data:/app/data            # dataset, store (sqlite), caches, reference faces, exports
    environment:
      - FTF_LLM=${FTF_LLM:-auto}    # claude CLI is not inside the container -> Gemini (GEMINI_API_KEY) or rules
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=fakefakefake
  scheduler:
    build: .
    command: ["python", "-m", "ftf.scheduler", "--every", "30", "--analyse"]
    volumes: ["./data:/app/data"]
    environment:
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    profiles: ["scheduler"]
  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/fakefakefake
    profiles: ["neo4j"]
